name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer test
      - run: find src opencart3 prestashop8 tests -name '*.php' -print0 | xargs -0 -n1 php -l
